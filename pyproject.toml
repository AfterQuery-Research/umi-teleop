[project]
name = "umi-teleop"
version = "0.1.0"
description = "Dual-UMI Vive teleoperation for two YAM robot arms"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy==2.2.6",
    "tyro>=1.0.15",
]

[project.optional-dependencies]
windows = [
    "openvr>=2.5; sys_platform == 'win32'",
]
source = [
    "gpiozero>=2.0; sys_platform == 'linux'",
    "lgpio>=0.2; sys_platform == 'linux'",
    "opencv-python-headless==4.12.0.88; sys_platform == 'linux'",
]
yam = [
    "i2rt @ git+https://github.com/AfterQuery-Research/i2rt.git@e599e9db90d644db6efe0b16bb6fd7cb87c4272f",
]
dataset = [
    "lerobot[dataset,intelrealsense] @ https://github.com/AfterQuery-Research/lerobot/archive/2d6e22c776883d55414351c76b51f02bdf28c3f3.tar.gz ; python_version >= '3.12'",
    "torch>=2.11,<2.12 ; python_version >= '3.12' and sys_platform == 'linux'",
    "torchvision>=0.26,<0.27 ; python_version >= '3.12' and sys_platform == 'linux'",
]

[project.scripts]
umi-teleop = "umi_teleop.local:main"
umi-pi-source = "umi_teleop.pi_source:main"
umi-vive-sim = "umi_teleop.vive_sim:main"
umi-vive-sender = "umi_teleop.windows:main"
umi-source = "umi_teleop.source:main"
umi-setup-can = "umi_teleop.setup_can:main"
umi-yam = "umi_teleop.yam:main"
umi-dataset-upload = "umi_teleop.dataset_cli:main"
umi-teleop-control = "umi_teleop.debug_control:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "opencv-python-headless==4.12.0.88",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]

[tool.uv]
build-constraint-dependencies = ["scikit-build-core<0.10"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: exercises multiple runtime components or optional LeRobot dependencies",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
