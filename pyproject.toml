[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "umi-teleop-fixed"
version = "0.1.0"
description = "A small, hardware-first UMI teleoperation stack."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2,<3",
    "opencv-contrib-python-headless>=4.10,<5",
    "tyro>=0.9,<2",
]

[project.optional-dependencies]
pi = [
    "gpiozero>=2,<3",
    "lgpio>=0.2.2.0; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'armv6l' or platform_machine == 'armv7l')",
]
robot = [
    "i2rt @ git+https://github.com/AfterQuery-Research/i2rt.git@e599e9db90d644db6efe0b16bb6fd7cb87c4272f",
]

[project.scripts]
umi-calibrate-gripper = "umi_teleop_fixed.calibrate_gripper:main"
umi-calibrate-umi-grippers = "umi_teleop_fixed.calibrate_umi_grippers:main"
umi-calibrate-tracking = "umi_teleop_fixed.calibrate_tracking:main"
umi-gripper-stream = "umi_teleop_fixed.gripper_stream:main"
umi-grippers = "umi_teleop_fixed.grippers:main"
umi-setup-can = "umi_teleop_fixed.setup_can:main"
umi-teleop = "umi_teleop_fixed.teleop:main"
umi-trackers = "umi_teleop_fixed.trackers:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
