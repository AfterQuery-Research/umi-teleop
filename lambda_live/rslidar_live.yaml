common:
  msg_source: 1
  send_packet_ros: false
  send_point_cloud_ros: true
lidar:
  - driver:
      lidar_type: RSAIRY
      msop_port: 6699
      difop_port: 7788
      imu_port: 6688
      start_angle: 0
      end_angle: 360
      min_distance: 0.1
      max_distance: 60.0
      # Live GLIM needs points + IMU on one host clock. The offline dataset path uses
      # packet timestamps; live teleop prefers robust low-latency odometry.
      use_lidar_clock: false
      dense_points: true
      ts_first_point: true
    ros:
      ros_frame_id: rslidar
      ros_send_point_cloud_topic: /rslidar_points
      ros_send_imu_data_topic: /rslidar_imu_data
      ros_queue_length: 100
